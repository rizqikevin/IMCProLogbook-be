name: machine-logbook

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: logbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.home}
      POSTGRES_DB: logbook
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U logbook -d logbook]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [private]

  migrate:
    build: .
    image: machine-logbook:home
    command: [migrate, up]
    environment:
      DATABASE_URL: postgres://logbook:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/logbook?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp:mode=1777,size=64m]
    networks: [private]

  app:
    image: machine-logbook:home
    restart: unless-stopped
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://logbook:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/logbook?sslmode=disable
      STORAGE_DRIVER: s3
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-false}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY}
      SESSION_TTL: ${SESSION_TTL:-12h}
      MAX_REQUEST_BYTES: 100000000
      MAX_PHOTO_BYTES: 10485760
      MAX_IMAGE_PIXELS: 40000000
      MAX_PHOTOS_PER_UPLOAD: 20
      MAX_PHOTOS_PER_LOGBOOK: 100
      MAX_CONCURRENT_UPLOADS: ${MAX_CONCURRENT_UPLOADS:-4}
      REQUEST_TIMEOUT: 2m
      SHUTDOWN_TIMEOUT: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp:mode=1777,size=512m]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    stop_grace_period: 35s
    networks: [private, outbound]

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    stop_grace_period: 35s
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:8080"
    networks: [private, tunnel]

  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: [tunnel, --no-autoupdate, run]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_healthy
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [tunnel]

networks:
  private:
    internal: true
  outbound:
  tunnel:
    name: machine-logbook-tunnel

volumes:
  db_data:

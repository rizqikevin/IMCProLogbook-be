# Shared local-storage stack for macOS and Linux; no .env required.
# PostgreSQL uses a fixed internal credential for this temporary setup.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: logbook
      POSTGRES_PASSWORD: logbook
      POSTGRES_DB: logbook
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U logbook -d logbook]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [private]

  migrate:
    build: .
    image: machine-logbook:local
    command: [migrate, up]
    environment:
      DATABASE_URL: postgres://logbook:logbook@db:5432/logbook?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp:mode=1777,size=64m"]
    networks: [private]

  app:
    build: .
    image: machine-logbook:local
    restart: unless-stopped
    environment:
      APP_ENV: production
      HTTP_ADDR: :18473
      DATABASE_URL: postgres://logbook:logbook@db:5432/logbook?sslmode=disable
      STORAGE_DRIVER: local
      LOCAL_STORAGE_PATH: /app/data/uploads
      CORS_ALLOWED_ORIGINS: ""
      SESSION_TTL: 12h
      MAX_REQUEST_BYTES: 100000000
      MAX_PHOTO_BYTES: 10485760
      MAX_IMAGE_PIXELS: 40000000
      MAX_PHOTOS_PER_UPLOAD: 20
      MAX_PHOTOS_PER_LOGBOOK: 100
      MAX_CONCURRENT_UPLOADS: 4
      REQUEST_TIMEOUT: 2m
      SHUTDOWN_TIMEOUT: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/app/data/uploads
    read_only: true
    tmpfs: ["/tmp:mode=1777,size=512m"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    stop_grace_period: 35s
    networks: [private]

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    stop_grace_period: 35s
    ports:
      - "127.0.0.1:18472:18472"
    networks: [private, tunnel]


networks:
  private:
    internal: true
  tunnel:

volumes:
  db_data:
  uploads:

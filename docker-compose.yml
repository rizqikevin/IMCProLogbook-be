# Development stack. Production uses a managed database, private S3, and TLS ingress.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: logbook
      POSTGRES_PASSWORD: logbook
      POSTGRES_DB: logbook
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logbook -d logbook"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    profiles: [s3]
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the bucket on first run.
  minio-init:
    profiles: [s3]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/logbook-dev
      "

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: machine-logbook:local
    command: ["migrate", "up"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://logbook:logbook@db:5432/logbook?sslmode=disable
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: machine-logbook:local
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://logbook:logbook@db:5432/logbook?sslmode=disable
      LOCAL_STORAGE_PATH: /app/data/uploads
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    volumes:
      - uploads:/app/data/uploads
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    stop_grace_period: 35s

volumes:
  db_data:
  minio_data:
  uploads:
